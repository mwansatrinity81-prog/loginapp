<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Create an account</h1>
  <form id="registerForm">
    <p><input type="text" id="regUsername" placeholder="Username"></p>
    <p><input type="password" id="regPassword" placeholder="Password (at least 8 characters)"></p>
    <button type="submit">Register</button>
  </form>
  <p id="registerResult"></p>

  <h1>Log in</h1>
  <form id="loginForm">
    <p><input type="text" id="loginUsername" placeholder="Username"></p>
    <p><input type="password" id="loginPassword" placeholder="Password"></p>
    <button type="submit">Log in</button>
  </form>
  <p id="loginResult"></p>

  <script src="app.js"></script>
</body>
</html>
